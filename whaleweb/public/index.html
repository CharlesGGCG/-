<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小鲸鱼 · 鲸忆</title>
<style>
  :root {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --ink: #1F1E1D;
    --ink-2: #6E6A62;
    --ink-3: #A39E95;
    --accent: #C96442;
    --accent-deep: #A84E2F;
    --accent-soft: #F0E2DA;
    --border: #E8E4DB;
    --bubble-her: #F4F0E8;
    --shadow: 0 1px 2px rgba(28,25,23,.04), 0 6px 20px rgba(28,25,23,.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif; font-weight: 600; letter-spacing: .01em; }
  .hidden { display: none !important; }

  /* —— 邀请门 —— */
  .gate { width: 100%; max-width: 400px; padding: 24px; }
  .gate-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: var(--shadow); padding: 40px 32px; text-align: center;
  }
  .gate .avatar { width: 72px; height: 72px; margin: 0 auto 18px; }
  .gate h1 { font-size: 26px; }
  .gate-sub { color: var(--ink-2); margin: 8px 0 24px; font-size: 14px; }
  .gate input {
    width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px;
    font-size: 15px; background: var(--bg); color: var(--ink); text-align: center; outline: none;
  }
  .gate input:focus { border-color: var(--accent); }
  .gate button {
    width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 15px; cursor: pointer; transition: background .15s;
  }
  .gate button:hover { background: var(--accent-deep); }
  .err { color: var(--accent-deep); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* —— 聊天 —— */
  .chat { width: 100%; max-width: 720px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; position: relative; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 18px 24px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    background: var(--accent-soft); border: 1px solid var(--border);
    transition: transform .2s ease;
  }
  .avatar.thinking { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  header h1 { font-size: 20px; }
  .status { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #B8B2A7; }
  .dot.on { background: #5FA87A; }
  .dot.thinking { background: var(--accent); animation: blink 1s infinite; }

  main { flex: 1; overflow-y: auto; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row.me { flex-direction: row-reverse; }
  .row .avatar { width: 32px; height: 32px; }
  .bubble {
    max-width: 74%; padding: 12px 16px; border-radius: 16px; line-height: 1.65; font-size: 15px;
    white-space: pre-wrap; word-break: break-word;
    animation: rise .3s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .row.her .bubble { background: var(--bubble-her); border-bottom-left-radius: 6px; }
  .row.me .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 6px; }
  .row.her .bubble::selection { background: #e3d7c8; }
  .bubble .retry {
    display: inline-block; margin-top: 8px; padding: 4px 12px; border: 1px solid var(--accent);
    border-radius: 8px; background: transparent; color: var(--accent); font-size: 13px; cursor: pointer;
  }
  .bubble .retry:hover { background: var(--accent-soft); }
  .typing { color: var(--ink-3); font-size: 13.5px; padding: 2px 4px; }
  .typing .dots::after { content: '…'; animation: blink 1.2s infinite; }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }

  footer {
    padding: 14px 24px 18px; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    font-size: 15px; font-family: inherit; color: var(--ink); background: var(--bg); outline: none;
    max-height: 140px; line-height: 1.5;
  }
  textarea:focus { border-color: var(--accent); }
  footer button {
    border: none; background: var(--accent); color: #fff; border-radius: 14px; padding: 12px 20px;
    font-size: 15px; cursor: pointer; transition: background .15s;
  }
  footer button:hover { background: var(--accent-deep); }
  footer button:disabled { background: var(--accent-soft); color: var(--ink-3); cursor: default; }

  .sticker-btn {
    width: 40px; height: 40px; flex-shrink: 0; border: 1px solid var(--border);
    background: var(--bg); border-radius: 12px; font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0; transition: background .15s, border-color .15s;
  }
  .sticker-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .sticker-panel {
    position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
    width: min(560px, calc(100vw - 32px)); max-height: 340px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: var(--shadow); padding: 14px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; z-index: 10;
  }
  .sticker-panel .st { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 8px; cursor: pointer; background: var(--bg); }
  .sticker-panel .st:hover { background: var(--accent-soft); outline: 2px solid var(--accent); }
  .bubble.img { padding: 4px; }
  .bubble.img img { max-width: 180px; max-height: 180px; border-radius: 10px; display: block; }

  @media (max-width: 560px) {
    .chat { max-width: 100%; }
    header { padding: 14px 16px; }
    main { padding: 20px 14px; gap: 14px; }
    footer { padding: 12px 14px 14px; }
    .bubble { max-width: 84%; font-size: 15px; }
    .gate-card { padding: 32px 24px; }
  }
</style>
</head>
<body>

  <!-- 邀请门 -->
  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <img class="avatar" src="/avatar.png" alt="🐋">
      <h1>小鲸鱼</h1>
      <p class="gate-sub">她住在这台电脑里，等你来。</p>
      <input id="invite" placeholder="邀请码" autocomplete="off">
      <button id="enter">进来</button>
      <div class="err" id="gate-err"></div>
    </div>
  </div>

  <!-- 聊天 -->
  <div id="chat" class="chat hidden">
    <header>
      <img class="avatar" id="head-avatar" src="/avatar.png" alt="🐋">
      <div>
        <h1>小鲸鱼</h1>
        <div class="status"><span class="dot" id="dot"></span><span id="status-text">……</span></div>
      </div>
    </header>
    <main id="msgs"></main>
    <footer>
      <button id="sticker-btn" class="sticker-btn" title="表情包">🐋</button>
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send">发</button>
    </footer>
    <div id="sticker-panel" class="sticker-panel hidden"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id)
  const msgs = $('msgs')

  function bubbleNode(role, text) {
    const row = document.createElement('div')
    row.className = 'row ' + role
    if (role === 'her') {
      const av = document.createElement('img')
      av.className = 'avatar'; av.src = '/avatar.png'; av.alt = '🐋'
      row.appendChild(av)
    }
    const b = document.createElement('div')
    b.className = 'bubble'; b.textContent = text
    row.appendChild(b)
    return row
  }

  function addBubble(role, text) {
    if (!text) return
    const row = bubbleNode(role, text)
    msgs.appendChild(row)
    msgs.scrollTop = msgs.scrollHeight
    return row
  }

  function setThinking(on) {
    const old = document.querySelector('.typing')
    if (old) old.remove()
    $('head-avatar').classList.toggle('thinking', on)
    $('dot').classList.toggle('thinking', on)
    if (on) {
      $('status-text').textContent = '她正在想…'
      const row = document.createElement('div')
      row.className = 'row her'
      const av = document.createElement('img')
      av.className = 'avatar thinking'; av.src = '/avatar.png'; av.alt = '🐋'
      row.appendChild(av)
      const t = document.createElement('div')
      t.className = 'typing'; t.innerHTML = '<span class="dots">她正在想</span>'
      row.appendChild(t)
      msgs.appendChild(row)
      msgs.scrollTop = msgs.scrollHeight
    } else {
      pollStatus()
    }
  }

  function addError(text, msg) {
    const row = document.createElement('div')
    row.className = 'row her'
    const av = document.createElement('img')
    av.className = 'avatar'; av.src = '/avatar.png'; av.alt = '🐋'
    row.appendChild(av)
    const b = document.createElement('div')
    b.className = 'bubble'
    const s = document.createElement('span')
    s.textContent = msg + '　'
    b.appendChild(s)
    const btn = document.createElement('button')
    btn.className = 'retry'; btn.textContent = '重试'
    btn.onclick = () => { row.remove(); deliver(text) }
    b.appendChild(btn)
    row.appendChild(b)
    msgs.appendChild(row)
    msgs.scrollTop = msgs.scrollHeight
  }

  async function loadHistory() {
    try {
      const r = await fetch('/api/history?limit=60').then(r => r.json())
      const list = Array.isArray(r && r.messages) ? r.messages : []
      if (list.length) {
        for (const m of list) addBubble(m.role === 'assistant' ? 'her' : 'me', m.text)
      } else {
        addBubble('her', '你来了呀～我是小鲸鱼。🐋 今天过得怎么样？')
      }
    } catch {
      addBubble('her', '你来了呀～我是小鲸鱼。🐋 今天过得怎么样？')
    }
  }

  async function enterChat() {
    $('gate').classList.add('hidden')
    $('chat').classList.remove('hidden')
    loadHistory()
    pollStatus()
  }

  async function pollStatus() {
    try {
      const r = await fetch('/api/status').then(r => r.json())
      $('dot').classList.remove('thinking')
      if (r && r.ok) {
        $('dot').classList.add('on')
        $('status-text').textContent = '在线 · 她在'
      } else {
        $('dot').classList.remove('on')
        $('status-text').textContent = '她这会儿不在'
      }
    } catch {
      $('dot').classList.remove('on')
      $('status-text').textContent = '连接不上'
    }
  }

  async function init() {
    try {
      const r = await fetch('/api/auth').then(r => r.json())
      if (r && r.authorized) { enterChat() } else { $('gate').classList.remove('hidden') }
    } catch { $('gate').classList.remove('hidden') }
  }

  $('enter').onclick = async () => {
    const code = $('invite').value.trim()
    if (!code) return
    try {
      const r = await fetch('/api/invite', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code }) }).then(r => r.json())
      if (r && r.ok) { location.reload() } else { $('gate-err').textContent = (r && r.error) || '邀请码不对' }
    } catch { $('gate-err').textContent = '网络出错，稍后再试' }
  }
  $('invite').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click() })

  $('send').onclick = () => {
    const input = $('input')
    const text = input.value.trim()
    if (!text) return
    input.value = ''; input.style.height = 'auto'
    addBubble('me', text)
    deliver(text)
  }
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click() }
  })
  $('input').addEventListener('input', () => {
    $('input').style.height = 'auto'
    $('input').style.height = Math.min($('input').scrollHeight, 140) + 'px'
  })

  async function deliver(text) {
    setThinking(true)
    $('send').disabled = true
    try {
      const r = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text }) }).then(r => r.json())
      setThinking(false)
      if (r && r.ok && r.reply) {
        addBubble('her', r.reply.text)
      } else {
        addError(text, (r && r.error) || '她好像走神了')
      }
    } catch {
      setThinking(false)
      addError(text, '连不上了')
    } finally {
      $('send').disabled = false
    }
  }

  // 表情包
  let stickers = []
  async function loadStickers() {
    try {
      const r = await fetch('/api/stickers').then(r => r.json())
      stickers = Array.isArray(r && r.stickers) ? r.stickers : []
      const panel = $('sticker-panel')
      panel.innerHTML = ''
      for (const s of stickers) {
        const img = document.createElement('img')
        img.className = 'st'; img.src = '/s/' + s.hash + '.gif'; img.alt = s.id; img.loading = 'lazy'; img.title = s.id
        img.onclick = () => sendSticker(s)
        panel.appendChild(img)
      }
    } catch {}
  }

  function sendSticker(s) {
    $('sticker-panel').classList.add('hidden')
    const row = document.createElement('div')
    row.className = 'row me'
    const b = document.createElement('div')
    b.className = 'bubble img'
    const img = document.createElement('img')
    img.src = '/s/' + s.hash + '.gif'; img.alt = s.id
    b.appendChild(img)
    row.appendChild(b)
    msgs.appendChild(row)
    msgs.scrollTop = msgs.scrollHeight
  }

  $('sticker-btn').onclick = () => {
    const panel = $('sticker-panel')
    panel.classList.toggle('hidden')
    if (!stickers.length) loadStickers()
  }

  init()
</script>
</body>
</html>
